# This workflow manages the pre-release version of the extension

name: Pre-release
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create or update pre-release branch
        id: setup_branch
        run: |
          BRANCH_NAME="pre-release-${{ steps.date.outputs.date }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify --quiet "refs/heads/$BRANCH_NAME"; then
            git checkout "$BRANCH_NAME"
            git rebase main
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Append develop to mf6-versions.txt
        run: |
          echo "develop" >> mf6-versions.txt
          git add mf6-versions.txt
          git commit -m "Append develop as mf6-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Regenerate from templates
        run: uv run utils/gen_from_dfn.py

      - name: Commit generated files
        run: |
          git add .
          git commit -m "Generate from DFN" || echo "No changes to commit"

      - name: Push changes
        run: git push --force origin ${{ steps.setup_branch.outputs.branch_name }}

      - name: Create Pull Request
        id: create_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.setup_branch.outputs.branch_name }}
        run: |
          PR_URL=$(gh pr create \
            --base pre-release \
            --head "$BRANCH_NAME" \
            --title "chore: Pre-release ${{ steps.date.outputs.date }}" \
            --body "This PR was auto-generated by a GitHub Action." \
            --label "automated pr")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Enable Auto-Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL"

  create-pre-release:
    needs: update-and-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: pre-release-${{ needs.update-and-pr.outputs.date }}
        run: |
          gh release create "$TAG_NAME" \
            --prerelease \
            --title "Pre-release ${{ needs.update-and-pr.outputs.date }}" \
            --notes "Automated pre-release based on daily updates."
