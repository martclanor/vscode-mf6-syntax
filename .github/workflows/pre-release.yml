# This workflow manages the pre-release version of the extension

name: Pre-release
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-and-pr:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create or update pre-release branch
        id: setup_branch
        run: |
          BRANCH_NAME="pre-release-${{ steps.date.outputs.date }}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            git rebase main
          else
            git checkout -b "$BRANCH_NAME"
          fi

      - name: Append develop to mf6-versions.txt
        id: version_update
        run: |
          if ! [ -f mf6-versions.txt ] || ! grep -qx "develop" mf6-versions.txt; then
            echo "develop" >> mf6-versions.txt
            git add mf6-versions.txt
            git commit -m "Append develop as mf6-version"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "\"develop\" is already present in mf6-versions.txt; nothing to append."
          fi

      - name: Download DFN data
        run: bash utils/download-dfn.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Regenerate from templates
        run: uv run utils/gen_from_dfn.py

      - name: Commit generated files
        id: gen_update
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate from DFN"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Check combined changes
        id: combined_changes
        run: |
          if [[ "${{ steps.version_update.outputs.has_changes }}" == "true" ]] || [[ "${{ steps.gen_update.outputs.has_changes }}" == "true" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.combined_changes.outputs.has_changes == 'true'
        run: git push --force-with-lease origin ${{ steps.setup_branch.outputs.branch_name }}

      - name: Create Pull Request
        if: steps.combined_changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.setup_branch.outputs.branch_name }}
        run: |
          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base pre-release --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Reusing existing PR: $EXISTING_PR"
            echo "pr_url=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            PR_URL=$(gh pr create \
              --base pre-release \
              --head "$BRANCH_NAME" \
              --title "chore: Pre-release ${{ steps.date.outputs.date }}" \
              --body "This PR was auto-generated by a GitHub Action." \
              --label "automated pr")
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          fi

      - name: Merge Pull Request
        if: steps.combined_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          gh pr merge --squash "$PR_URL"

  create-pre-release:
    needs: update-and-pr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create or Update GitHub Pre-Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: pre-release-${{ needs.update-and-pr.outputs.date }}
        run: |
          # Check if release already exists
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME already exists, updating..."
            gh release edit "$TAG_NAME" \
              --title "Pre-release ${{ needs.update-and-pr.outputs.date }}" \
              --notes "Automated pre-release based on daily updates."
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --target pre-release \
              --title "Pre-release ${{ needs.update-and-pr.outputs.date }}" \
              --draft \
              --notes "Automated pre-release based on daily updates."
          fi
